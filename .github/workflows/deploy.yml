# Déclenché chaque nuit par le Worker Cloudflare (voir cron-worker/), et à chaque modification du site :
#   1. télécharge le GTFS Static du TEC (public, CC0)
#   2. génère site/horaire.json
#   3. déploie le dossier site/ sur le projet Cloudflare Pages existant
# Si l'étape 2 échoue (aucun trajet trouvé), rien n'est déployé : l'ancienne version reste en ligne.
name: Horaire TEC + déploiement

on:
  push:
    branches: [main]
  workflow_dispatch:            # lancé chaque nuit par le Worker Cloudflare « cron-worker » (ou à la main)

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Télécharger le GTFS Static du TEC
        run: |
          curl -fL --retry 4 --retry-delay 15 -o gtfs.zip "https://opendata.tec-wl.be/Current%20GTFS/TEC-GTFS.zip"
          ls -l gtfs.zip

      - name: Générer horaire.json
        run: python build-horaire.py gtfs.zip site/horaire.json

      - name: Déployer sur Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=1bhih1 --branch=main
